<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetCheck - History</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1 class="title">NetCheck - History</h1>
      <p class="subtitle">All previous device checks.</p>
      <div class="nav-links">
        <a href="{{ url_for('home') }}" class="history-link">Home</a>
        <a href="{{ url_for('history_page') }}" class="history-link">Refresh</a>
      </div>
      <table class="device-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>IP Address</th>
            <th>Status</th>
            <th>Response Time (ms)</th>
            <th>Checked At</th>
          </tr>
        </thead>
        <tbody>
          {% for h in history %}
          <tr>
            <td>{{ h.name }}</td>
            <td>{{ h.ip }}</td>
            <td>{{ h.status }}</td>
            <td>{{ h.response_time_ms if h.response_time_ms is not none else '-' }}</td>
            <td>{{ h.checked_at }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
